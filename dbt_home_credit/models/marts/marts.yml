version: 2

models:
  - name: fct_loan_application
    description: One labeled TRAIN application for the MVP Power BI model.
    columns:
      - name: ApplicationID
        description: Home Credit application business key.
        tests: [not_null, unique]
      - name: DefaultFlag
        description: Binary target for the labeled TRAIN population.
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: SourceBatchID
        tests: [not_null]

