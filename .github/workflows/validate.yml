name: Project validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate code-first artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile Python utilities
        run: python -m py_compile scripts/*.py

      - name: Validate KPI baseline invariants
        run: python scripts/validate_kpi_baseline.py

      - name: Validate repository artifacts
        run: python scripts/validate_project_artifacts.py --skip-raw
